name: Refresh and deploy

on:
  schedule:
    # Three times a day, 7am / 1pm / 7pm Mountain (MDT; an hour earlier on the clock in winter). GitHub cron is
    # UTC and best-effort: a run can start several minutes late, and the odd minute keeps clear of the top of the hour.
    - cron: "17 13 * * *"
    - cron: "17 19 * * *"
    - cron: "17 1 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# One deploy at a time; a queued run waits instead of cancelling one that is publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch live data from api.legmt.gov
        run: python3 scripts/build_data.py

      - name: Commit changed data
        run: |
          git config user.name "dashboard-refresh[bot]"
          git config user.email "dashboard-refresh@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "data: refresh from api.legmt.gov ($(date -u +%Y-%m-%dT%H:%MZ))"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      # Pages serves assets with a 10-minute cache. Without a version in the URL a visitor could get the new
      # page with the previous app.js. Stamp it into the deployed copy only (the committed file keeps __V__).
      - name: Stamp asset version
        run: sed -i "s/__V__/${GITHUB_SHA::8}-${GITHUB_RUN_ID}/g" docs/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4
